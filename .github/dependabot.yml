version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      production-patches:
        dependency-type: production
        update-types:
          - patch
      development-patches:
        dependency-type: development
        update-types:
          - patch
    ignore:
      # Major upgrades need isolated migration PRs and targeted regression tests.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /expo-ios
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    # No production/development-patches groups here: unlike the web app,
    # Expo and React Native pin their own dependency graph (react,
    # react-native, react-native-iap, react-native-webview, Nitro modules)
    # to a narrow, mutually-compatible version window per Expo SDK release.
    # Grouping patches together risks bundling an incompatible pair into one
    # PR and masking which single bump broke a native build; one PR per
    # dependency keeps each bump bisectable, which matters most for the
    # payment surface (react-native-iap, react-native-webview) this directory
    # exists to monitor.
    ignore:
      # Patch-only for this directory. The native shell is the StoreKit
      # payment surface, and CI can typecheck it and run expo-doctor but
      # cannot build the app or exercise a purchase -- react-native-iap is a
      # native module, so neither Expo Go nor a GitHub runner can test it
      # (see expo-ios/README.md). A green check here therefore does not mean
      # a minor bump is safe. Minors and majors now need a deliberate
      # upgrade validated by an EAS build on a signed device.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
