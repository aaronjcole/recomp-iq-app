<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/recompiq-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/recompiq-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#12836f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07110f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="RecompIQ is an adaptive health companion that builds personalized nutrition and training plans around your real progress — recomp signal, weekly check-ins, and an AI coach." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RecompIQ" />
    <meta property="og:title" content="RecompIQ — adaptive recomposition" />
    <meta property="og:description" content="Personalized nutrition and training plans that adapt to your real progress. Download on Google Play." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>RecompIQ — adaptive recomposition</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("recomp-theme");
          if (t !== "dark" && t !== "light") {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
